<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab — Lava Lamp 測試</title>
<link rel="stylesheet" href="font.css">
<style>
  :root{ --ink:#F7F6F3; --blue:#0B4FD9; }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:#0A0A0A; color:var(--ink);
    font-family:'GT Walsheim Trial','Noto Sans TC',sans-serif;
    overflow:hidden;
  }

  /* ---- Hero mock：只為了判斷字壓在效果上讀不讀得到 ---- */
  #stage{ position:fixed; inset:0; }
  #lava{ position:absolute; inset:0; }
  .hero-mock{
    position:absolute; inset:0; z-index:2;
    display:flex; flex-direction:column; justify-content:center;
    padding:0 60px; pointer-events:none;
  }
  .eyebrow{
    font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:rgba(247,246,243,.55); margin-bottom:24px;
  }
  .hero-name{
    font-weight:400; font-size:clamp(64px,11vw,180px); line-height:.92;
    letter-spacing:-.03em;
  }
  .hero-name .dot{ color:var(--blue); }
  .scroll-label{
    position:absolute; left:60px; bottom:40px;
    font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:rgba(247,246,243,.45);
  }
  .hero-mock.off{ display:none; }

  /* ---- 控制台 ---- */
  #panel{
    position:fixed; top:0; right:0; z-index:10; width:290px; height:100vh;
    overflow-y:auto; background:rgba(12,12,12,.92); backdrop-filter:blur(12px);
    border-left:1px solid rgba(255,255,255,.1); padding:18px 18px 40px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px;
  }
  #panel h2{ font-size:10px; letter-spacing:.16em; text-transform:uppercase;
    color:rgba(247,246,243,.45); font-weight:400; margin:18px 0 10px; }
  #panel h2:first-child{ margin-top:0; }
  .row{ display:flex; align-items:center; gap:8px; margin-bottom:9px; }
  .row label{ flex:0 0 76px; color:rgba(247,246,243,.6); }
  .row input[type=range]{ flex:1; min-width:0; accent-color:var(--blue); }
  .row .val{ flex:0 0 30px; text-align:right; color:var(--ink); }
  .row input[type=color]{ width:38px; height:22px; padding:0; border:1px solid rgba(255,255,255,.15);
    background:none; border-radius:3px; cursor:pointer; }
  .row code{ color:rgba(247,246,243,.5); font-size:10px; }
  .btns{ display:flex; flex-wrap:wrap; gap:6px; }
  button{
    font:inherit; color:var(--ink); background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.14); border-radius:4px;
    padding:6px 9px; cursor:pointer;
  }
  button:hover{ background:rgba(255,255,255,.14); }
  button.on{ background:var(--blue); border-color:var(--blue); }
  #fps{
    position:fixed; left:16px; top:14px; z-index:10;
    font-family:ui-monospace,Menlo,monospace; font-size:11px;
    color:rgba(247,246,243,.75); background:rgba(12,12,12,.7);
    padding:6px 10px; border-radius:4px; line-height:1.6;
    border:1px solid rgba(255,255,255,.1); white-space:pre;
  }
  #out{
    width:100%; height:150px; margin-top:8px; resize:vertical;
    font-family:ui-monospace,Menlo,monospace; font-size:10px; line-height:1.5;
    color:var(--ink); background:rgba(0,0,0,.5);
    border:1px solid rgba(255,255,255,.14); border-radius:4px; padding:8px;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="lava"></div>
  <div class="hero-mock" id="heroMock">
    <p class="eyebrow">Brand &amp; UI/UX Designer — 2026</p>
    <h1 class="hero-name">Fuyu<br>Tsai<span class="dot">.</span></h1>
    <span class="scroll-label">Scroll to explore — 01 / 03</span>
  </div>
</div>

<div id="fps">—</div>
<div id="panel"></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from "three";

/* ══════════════════════════════════════════════════════════════════
   以下到 END PORT 為止，是 Originkit「Lava Lamp」原始碼。
   只做了三件事：拿掉 TypeScript 型別標註、拿掉 React 外殼、
   把 renderer 的 pixelRatio 上限抽成建構參數（實驗室要測效能）。
   GLSL 一個字都沒動。
   ══════════════════════════════════════════════════════════════════ */

const MAX_BLOBS = 20

const CAM_Z = 2.4
const RAY_FOCAL = 1.4

const DEFAULTS = {
    top: "#FFFE00",
    bottom: "#13BB00",
    sheen: "#FFF400",
    blobs: 20,
    scale: 5,
    viscosity: 5,
    speed: 20,
    glow: 20,
    gloss: 20,
    wander: 10,
    magnet: 20,
    sizePercent: 75,
}

function clamp(v, lo, hi, fallback) {
    const n = typeof v === "number" && isFinite(v) ? v : fallback
    return Math.max(lo, Math.min(hi, n))
}

/** Panel values are whole numbers; the shader wants the real ones. */
function settingsFor(cfg) {
    return {
        blobs: Math.round(clamp(cfg.blobs, 1, MAX_BLOBS, DEFAULTS.blobs)),
        scale: 0.12 + clamp(cfg.scale, 1, 20, DEFAULTS.scale) * 0.022,
        viscosity: 0.05 + clamp(cfg.viscosity, 1, 20, DEFAULTS.viscosity) * 0.035,
        speed: clamp(cfg.speed, 0, 20, DEFAULTS.speed) * 0.075,
        glow: 0.3 + clamp(cfg.glow, 0, 20, DEFAULTS.glow) * 0.06,
        gloss: 8 + clamp(cfg.gloss, 1, 20, DEFAULTS.gloss) * 5,
        wander: clamp(cfg.wander, 0, 20, DEFAULTS.wander) * 0.035,
        magnet: clamp(cfg.magnet, 0, 20, DEFAULTS.magnet) * 0.028,
        zoom: 100 / clamp(cfg.sizePercent, 20, 200, 100),
    }
}

const QUAD_VERTEX = /* glsl */ `
    varying vec2 vUv;
    void main() {
        vUv = uv;
        // Already in clip space; no camera is involved.
        gl_Position = vec4(position.xy, 0.0, 1.0);
    }
`

const LAVA_FRAGMENT = /* glsl */ `
    precision highp float;

    #define MAX_BLOBS ${MAX_BLOBS}

    uniform vec2 uResolution;
    uniform vec3 uTop;
    uniform vec3 uBottom;
    uniform vec3 uSheen;
    uniform float uTime;
    uniform float uCount;
    uniform float uScale;
    uniform float uViscosity;
    uniform float uGlow;
    uniform float uGloss;
    uniform float uWander;
    uniform float uZoom;
    uniform vec2 uPointer;
    uniform float uMagnet;

    varying vec2 vUv;

    float smin(float a, float b, float k) {
        float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
        return mix(b, a, h) - k * h * (1.0 - h);
    }

    vec4 blob(int i) {
        float f = float(i);
        float rate = 0.5 + fract(f * 0.37) * 0.6;
        float phase = f * 2.399;
        float y = sin(uTime * rate + phase) * 0.62;
        float x = sin(uTime * rate * 0.61 + phase * 1.7) * uWander;
        float z = cos(uTime * rate * 0.43 + phase * 2.3) * uWander;
        float r = uScale * (0.75 + fract(f * 0.71) * 0.6);

        vec2 toPointer = uPointer - vec2(x, y);
        float grip = exp(-dot(toPointer, toPointer) * 2.2);
        float give = uMagnet * grip * (1.3 - r * 1.4);
        vec2 pulled = vec2(x, y) + toPointer * give;

        return vec4(pulled, z, r);
    }

    float map(vec3 p) {
        float d = 1e9;
        for (int i = 0; i < MAX_BLOBS; i++) {
            if (float(i) < uCount) {
                vec4 b = blob(i);
                float squash = 1.0 + 0.22 * sin(uTime * (0.5 + fract(float(i) * 0.37) * 0.6) + float(i) * 2.399);
                vec3 q = p - b.xyz;
                q.y /= squash;
                d = smin(d, length(q) - b.w, uViscosity);
            }
        }
        return d;
    }

    vec3 normalAt(vec3 p) {
        vec2 e = vec2(0.0015, 0.0);
        return normalize(vec3(
            map(p + e.xyy) - map(p - e.xyy),
            map(p + e.yxy) - map(p - e.yxy),
            map(p + e.yyx) - map(p - e.yyx)
        ));
    }

    void main() {
        vec2 uv = (vUv - 0.5) * uZoom;
        uv.x *= uResolution.x / max(1.0, uResolution.y);

        vec3 ro = vec3(0.0, 0.0, ${CAM_Z.toFixed(3)});
        vec3 rd = normalize(vec3(uv, -${RAY_FOCAL.toFixed(3)}));

        float t = 0.0;
        float hit = 0.0;
        for (int i = 0; i < 72; i++) {
            vec3 p = ro + rd * t;
            float d = map(p);
            if (d < 0.001) { hit = 1.0; break; }
            t += d * 0.9;
            if (t > 5.0) break;
        }

        if (hit < 0.5) discard;

        vec3 p = ro + rd * t;
        vec3 n = normalAt(p);
        vec3 v = -rd;

        float h = clamp(p.y * 0.9 + 0.5, 0.0, 1.0);
        vec3 col = mix(uBottom, uTop, h);

        vec3 L = normalize(vec3(-0.4, 0.7, 0.8));
        float diff = max(dot(n, L), 0.0);
        float wrap = 0.5 + 0.5 * dot(n, L);
        col *= 0.35 + diff * 0.6 + wrap * 0.25;

        float fres = pow(1.0 - max(dot(n, v), 0.0), 3.0);
        col += mix(uBottom, uTop, h) * fres * uGlow;

        vec3 hv = normalize(L + v);
        col += uSheen * pow(max(dot(n, hv), 0.0), uGloss) * 0.6;

        gl_FragColor = vec4(col, 1.0);
    }
`

class LavaScene {
    scene = new THREE.Scene()
    camera = new THREE.Camera()
    geometry = new THREE.PlaneGeometry(2, 2)

    pointer = new THREE.Vector2(0, 0)
    pointerTarget = new THREE.Vector2(0, 0)
    grip = 0
    gripTarget = 0
    time = 0
    frameId = 0
    lastT = 0
    disposed = false
    unbind = () => {}

    constructor(container, cfg, drCap = 1.5) {
        this.container = container
        this.cfg = cfg
        const S = settingsFor(cfg)

        this.renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true })
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, drCap))
        this.renderer.outputColorSpace = THREE.SRGBColorSpace
        this.renderer.setClearColor(0x000000, 0)
        const el = this.renderer.domElement
        el.style.position = "absolute"
        el.style.inset = "0"
        el.style.width = "100%"
        el.style.height = "100%"
        container.appendChild(el)

        this.material = new THREE.ShaderMaterial({
            vertexShader: QUAD_VERTEX,
            fragmentShader: LAVA_FRAGMENT,
            uniforms: {
                uResolution: { value: new THREE.Vector2(1, 1) },
                uTop: { value: new THREE.Color(cfg.top) },
                uBottom: { value: new THREE.Color(cfg.bottom) },
                uSheen: { value: new THREE.Color(cfg.sheen) },
                uTime: { value: 0 },
                uCount: { value: S.blobs },
                uScale: { value: S.scale },
                uViscosity: { value: S.viscosity },
                uGlow: { value: S.glow },
                uGloss: { value: S.gloss },
                uWander: { value: S.wander },
                uZoom: { value: S.zoom },
                uPointer: { value: new THREE.Vector2(0, 0) },
                uMagnet: { value: 0 },
            },
            transparent: true,
            depthTest: false,
            depthWrite: false,
        })

        this.mesh = new THREE.Mesh(this.geometry, this.material)
        this.mesh.frustumCulled = false
        this.scene.add(this.mesh)
        this.bindEvents()
    }

    toField(e) {
        const el = this.renderer.domElement
        const rect = el.getBoundingClientRect()
        if (rect.width <= 0 || rect.height <= 0) return null
        const aspect = rect.width / rect.height
        const zoom = settingsFor(this.cfg).zoom
        const vx = (e.clientX - rect.left) / rect.width
        const vy = 1 - (e.clientY - rect.top) / rect.height
        const k = CAM_Z / RAY_FOCAL
        return new THREE.Vector2(
            (vx - 0.5) * zoom * aspect * k,
            (vy - 0.5) * zoom * k
        )
    }

    bindEvents() {
        const el = this.renderer.domElement
        el.style.touchAction = "none"

        const move = (e) => {
            const p = this.toField(e)
            if (!p) return
            this.pointerTarget.copy(p)
            this.gripTarget = 1
        }
        const leave = () => { this.gripTarget = 0 }

        el.addEventListener("pointermove", move)
        el.addEventListener("pointerenter", move)
        el.addEventListener("pointerleave", leave)
        el.addEventListener("pointercancel", leave)
        this.unbind = () => {
            el.removeEventListener("pointermove", move)
            el.removeEventListener("pointerenter", move)
            el.removeEventListener("pointerleave", leave)
            el.removeEventListener("pointercancel", leave)
        }
    }

    start() {
        this.lastT = performance.now()
        const loop = () => {
            this.frameId = requestAnimationFrame(loop)
            this.step()
        }
        loop()
    }

    setSize(width, height) {
        if (this.disposed || width <= 0 || height <= 0) return
        this.renderer.setSize(width, height, false)
        this.material.uniforms.uResolution.value.set(width, height)
    }

    updateConfig(cfg) {
        if (this.disposed) return
        this.cfg = cfg
        const S = settingsFor(cfg)
        const u = this.material.uniforms
        u.uTop.value.set(cfg.top || "#ffffff")
        u.uBottom.value.set(cfg.bottom || "#ffffff")
        u.uSheen.value.set(cfg.sheen || "#ffffff")
        u.uCount.value = S.blobs
        u.uScale.value = S.scale
        u.uViscosity.value = S.viscosity
        u.uGlow.value = S.glow
        u.uGloss.value = S.gloss
        u.uWander.value = S.wander
        u.uZoom.value = S.zoom
    }

    step() {
        if (this.disposed) return
        const now = performance.now()
        let dt = (now - this.lastT) / 1000
        this.lastT = now
        if (!isFinite(dt) || dt < 0) dt = 0
        if (dt > 0.05) dt = 0.05

        const S = settingsFor(this.cfg)
        this.time += dt * S.speed

        this.grip += (this.gripTarget - this.grip) * (1 - Math.exp(-dt * 4.0))
        this.pointer.lerp(this.pointerTarget, 1 - Math.exp(-dt * 9.0))

        const u = this.material.uniforms
        u.uTime.value = this.time
        u.uPointer.value.copy(this.pointer)
        u.uMagnet.value = S.magnet * this.grip
        this.renderer.render(this.scene, this.camera)
    }

    dispose() {
        this.disposed = true
        cancelAnimationFrame(this.frameId)
        this.unbind()
        this.geometry.dispose()
        this.material.dispose()
        this.renderer.dispose()
        const el = this.renderer.domElement
        if (el.parentNode === this.container) this.container.removeChild(el)
    }
}

/* ══════════════════════════ END PORT ══════════════════════════ */


/* ---------- 實驗室：控制台 + FPS，正式上線不會帶這段 ---------- */

const PRESETS = {
  "Wax Blue": { top:"#3D8BFF", bottom:"#0A2E7A", sheen:"#CFE2FF",
                blobs:11, scale:6, viscosity:7, speed:6, glow:14, gloss:12,
                wander:16, magnet:14, sizePercent:55 },
  "Scatter": { top:"#4A90FF", bottom:"#0B3A9E", sheen:"#DCEAFF",
                blobs:14, scale:4, viscosity:6, speed:5, glow:16, gloss:12,
                wander:18, magnet:14, sizePercent:38 },
  "Blue→Paper": { top:"#F7F6F3", bottom:"#0B4FD9", sheen:"#FFFFFF",
                blobs:11, scale:6, viscosity:7, speed:6, glow:8, gloss:16,
                wander:16, magnet:14, sizePercent:55 },
  "Originkit 原色": { ...DEFAULTS, speed:8 },
}

const SLIDERS = [
  ["blobs","顆數",1,20], ["scale","大小",1,20], ["viscosity","黏度",1,20],
  ["speed","速度",0,20], ["glow","邊光",0,20], ["gloss","高光",1,20],
  ["wander","飄移",0,20], ["magnet","磁吸",0,20], ["sizePercent","縮放%",20,200],
]

let cfg = { ...PRESETS["Wax Blue"] }
let drCap = 1.5

const host = document.getElementById("lava")
let scene = new LavaScene(host, cfg, drCap)
scene.setSize(host.clientWidth, host.clientHeight)
scene.start()
new ResizeObserver(() => scene.setSize(host.clientWidth, host.clientHeight)).observe(host)

function rebuild() {
  scene.dispose()
  scene = new LavaScene(host, cfg, drCap)
  scene.setSize(host.clientWidth, host.clientHeight)
  scene.start()
}

// ---- 控制台 UI ----
const panel = document.getElementById("panel")
function el(tag, cls, html) {
  const n = document.createElement(tag)
  if (cls) n.className = cls
  if (html != null) n.innerHTML = html
  return n
}

panel.appendChild(el("h2", null, "Preset"))
const presetBox = el("div", "btns")
Object.keys(PRESETS).forEach(name => {
  const b = el("button", null, name)
  b.onclick = () => {
    cfg = { ...PRESETS[name] }
    syncUI(); scene.updateConfig(cfg)
    ;[...presetBox.children].forEach(c => c.classList.remove("on"))
    b.classList.add("on")
  }
  presetBox.appendChild(b)
})
presetBox.firstChild.classList.add("on")
panel.appendChild(presetBox)

panel.appendChild(el("h2", null, "顏色"))
const COLORS = [["bottom","下 / 底色"],["top","上 / 頂色"],["sheen","高光"]]
const colorInputs = {}
COLORS.forEach(([key,label]) => {
  const row = el("div","row")
  row.appendChild(el("label",null,label))
  const i = document.createElement("input")
  i.type = "color"; i.value = cfg[key]
  i.oninput = () => { cfg[key] = i.value; scene.updateConfig(cfg); dump() }
  const code = el("code",null,cfg[key])
  i.addEventListener("input", () => code.textContent = i.value)
  colorInputs[key] = { i, code }
  row.appendChild(i); row.appendChild(code)
  panel.appendChild(row)
})

panel.appendChild(el("h2", null, "參數"))
const sliderInputs = {}
SLIDERS.forEach(([key,label,lo,hi]) => {
  const row = el("div","row")
  row.appendChild(el("label",null,label))
  const i = document.createElement("input")
  i.type = "range"; i.min = lo; i.max = hi; i.step = 1; i.value = cfg[key]
  const v = el("span","val",String(cfg[key]))
  i.oninput = () => {
    cfg[key] = Number(i.value); v.textContent = i.value
    scene.updateConfig(cfg); dump()
  }
  sliderInputs[key] = { i, v }
  row.appendChild(i); row.appendChild(v)
  panel.appendChild(row)
})

panel.appendChild(el("h2", null, "效能 / 檢視"))
const drBox = el("div","btns")
;[1, 1.5, 2].forEach(x => {
  const b = el("button", null, "DPR " + x)
  if (x === drCap) b.classList.add("on")
  b.onclick = () => {
    drCap = x; rebuild()
    ;[...drBox.children].forEach(c => c.classList.remove("on"))
    b.classList.add("on")
  }
  drBox.appendChild(b)
})
panel.appendChild(drBox)

const viewBox = el("div","btns")
viewBox.style.marginTop = "6px"
const mock = document.getElementById("heroMock")
const bType = el("button","on","顯示標題")
bType.onclick = () => { mock.classList.toggle("off"); bType.classList.toggle("on") }
viewBox.appendChild(bType)
panel.appendChild(viewBox)

panel.appendChild(el("h2", null, "目前設定（複製用）"))
const out = document.createElement("textarea")
out.id = "out"; out.readOnly = true
panel.appendChild(out)

function dump() {
  out.value = JSON.stringify(cfg, null, 2)
}
function syncUI() {
  COLORS.forEach(([k]) => { colorInputs[k].i.value = cfg[k]; colorInputs[k].code.textContent = cfg[k] })
  SLIDERS.forEach(([k]) => { sliderInputs[k].i.value = cfg[k]; sliderInputs[k].v.textContent = String(cfg[k]) })
  dump()
}
syncUI()

// ---- FPS ----
const fpsEl = document.getElementById("fps")
let frames = 0, acc = 0, last = performance.now(), worst = 999
function tick() {
  const now = performance.now()
  const dt = now - last; last = now
  frames++; acc += dt
  if (acc >= 500) {
    const fps = frames / (acc / 1000)
    if (fps < worst) worst = fps
    const px = Math.round(host.clientWidth * scene.renderer.getPixelRatio()) *
               Math.round(host.clientHeight * scene.renderer.getPixelRatio())
    fpsEl.textContent =
      `${fps.toFixed(0)} fps   (最低 ${worst.toFixed(0)})\n` +
      `${(px/1e6).toFixed(2)} M px  ·  DPR ${scene.renderer.getPixelRatio()}\n` +
      `${cfg.blobs} blobs  ·  ~${(72*cfg.blobs + 6*cfg.blobs).toLocaleString()} 次/px/幀`
    frames = 0; acc = 0
  }
  requestAnimationFrame(tick)
}
tick()
document.addEventListener("keydown", e => { if (e.key === "r") worst = 999 })

window.__lava = { get scene(){ return scene }, get cfg(){ return cfg } }
</script>
</body>
</html>
