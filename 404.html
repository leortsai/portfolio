<script>
/* 首屏的捲動淡入不要等 CDN。main.js 排在 lenis／gsap 之後，模擬 4G 下
   要十秒才輪到它跑，首屏的 .reveal 在那之前都是 opacity:0，LCP 因此被拖長。
   這段是行內的，解析到就執行，先把已經在畫面內的區塊打開。 */
(function () {
  var vh = window.innerHeight || 800;
  var els = document.querySelectorAll('.reveal');
  for (var i = 0; i < els.length; i++) {
    if (els[i].getBoundingClientRect().top < vh) els[i].classList.add('visible');
  }

})();
</script>
